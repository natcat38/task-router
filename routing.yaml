# Routing config for task-router (Tech_Scope.md §2 shape).
#
# Editable live via PUT /v1/routing-config (Tech_Scope.md §4) -- no restart
# needed. judge_sample_rate ships at 0.2 (judge one request in five). The
# scoring battery (battery.py) sets 1.0 itself on a temporary copy of this
# file, so this value never has to be changed for it.
tier_map:
  local: qwen3:1.7b
  sonnet: sonnet
  opus: opus
judge_sample_rate: 0.2
use_cases:
  extract:
    judge_threshold: 4
  reformat:
    judge_threshold: 4
  qa_context:
    judge_threshold: 4
  summarise:
    judge_threshold: 4
  classify:
    judge_threshold: 5
  analyse:
    judge_threshold: 4
  reason:
    judge_threshold: 4
  create:
    judge_threshold: 3
  judge:
    judge_threshold: 4
